
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiveTrack | Admin Setup</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #102a43, #176b87);
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,.2);
        }

        h2 {
            text-align: center;
            color: #176b87;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #176b87;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>GiveTrack</h2>

    <p>Create your first Administrator account</p>

    <form id="setupForm">

        <label for="name">Admin Name</label>
        <input type="text" id="name" required maxlength="100">

        <label for="email">Email Address</label>
        <input type="email" id="email" required maxlength="150">

        <label for="password">Password</label>
        <input type="password" id="password"
               required minlength="10" autocomplete="new-password">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               required minlength="10" autocomplete="new-password">

        <button type="submit">Create Admin Account</button>

        <div id="message" role="alert"></div>

    </form>

</div>

<script>
    const basePath = window.location.pathname.substring(
        0, window.location.pathname.lastIndexOf("/")
    );

    const API = basePath + "/api";
    const message = document.getElementById("message");
    const form = document.getElementById("setupForm");

    async function checkSetup() {
        try {
            const response = await fetch(API + "/setup-status");
            const result = await response.json();

            if (!response.ok || !result.setupRequired) {
                message.textContent =
                    "Admin setup is already completed. Please log in.";

                form.style.display = "none";

                setTimeout(() => {
                    window.location.href = basePath + "/login.html";
                }, 2000);
            }
        } catch (error) {
            message.textContent = "Unable to check setup status.";
        }
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
        }

        message.textContent = "Creating Admin account...";

        try {
            const response = await fetch(API + "/setup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Setup failed.");
            }

            message.style.color = "green";
            message.textContent =
                "Admin account created successfully! Redirecting to login...";

            form.reset();

            setTimeout(() => {
                window.location.href = basePath + "/login.html";
            }, 2000);

        } catch (error) {
            message.style.color = "#b42318";
            message.textContent = error.message;
        }
    });

    checkSetup();
</script>

</body>
</html>
